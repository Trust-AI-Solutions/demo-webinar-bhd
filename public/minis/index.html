<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minis by Mónica · Ventas y reparto</title>
<meta name="description" content="Demostración del sistema de consignación y reparto de Minis by Mónica, con datos ficticios.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#e02b20">
<link rel="stylesheet" href="css/minis.css">
</head>
<body>
<header class="cabecera no-imprimir">
  <div class="marca">
    <span class="logo" aria-hidden="true">M</span>
    <div>
      <h1>Minis by Mónica</h1>
      <p><span class="sub">Sistema de ventas y reparto en tiempo real</span> <span class="pill pill-linea" id="sync">● En línea — datos compartidos</span></p>
    </div>
  </div>
  <nav class="nav" role="tablist" aria-label="Secciones">
    <button class="tab" role="tab" id="tab-panel" data-vista="panel" aria-selected="true">📊 Panel</button>
    <button class="tab" role="tab" id="tab-despacho" data-vista="despacho" aria-selected="false">🚚 Despacho</button>
    <button class="tab" role="tab" id="tab-choferes" data-vista="choferes" aria-selected="false">💬 Choferes<span class="ocultar-movil"> por WhatsApp</span> <span class="contador" id="contador-avisos" hidden></span></button>
  </nav>
</header>

<main class="no-imprimir">
  <section id="vista-panel" role="tabpanel" aria-labelledby="tab-panel"></section>
  <section id="vista-despacho" role="tabpanel" aria-labelledby="tab-despacho" hidden></section>
  <section id="vista-choferes" role="tabpanel" aria-labelledby="tab-choferes" hidden></section>
</main>

<div id="area-impresion" class="solo-imprimir"></div>

<footer class="pie no-imprimir">Piloto — The Trust for the Americas · Demostración: tiendas, cadenas, precios, choferes y cifras son ficticios.</footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
