<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel · Panadería El Trigal</title>
<meta name="description" content="Panel de negocio de una panadería ficticia, con asistente de IA. Demostración con datos ficticios.">
<link rel="preload" href="fuentes/inter-variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/estilos.css">
<script src="vendor/chart-4.4.1.umd.js"></script>
</head>
<body>
<div class="panel">
  <aside class="lateral">
    <a class="marca" href="index.html"><span class="logo" data-icono="logo"></span>Panadería El Trigal</a>
    <nav class="nav" id="nav" aria-label="Secciones del panel">
      <button data-vista="inicio" class="activo"><span data-icono="inicio"></span>Inicio</button>
      <button data-vista="ventas"><span data-icono="ventas"></span>Ventas</button>
      <button data-vista="inventario"><span data-icono="inventario"></span>Insumos y menú</button>
      <button data-vista="cobros"><span data-icono="clientes"></span>Clientes y cobros</button>
      <button data-vista="pedidos"><span data-icono="pedidos"></span>Pedidos <span class="contador oculto" id="contador-pedidos"></span></button>
      <button data-vista="alertas"><span data-icono="alertas"></span>Alertas <span class="contador urgente oculto" id="contador-alertas"></span></button>
    </nav>
    <button class="preguntar" id="abrir-asistente" type="button"><span data-icono="chispa"></span>Pregúntale a tu negocio</button>
  </aside>

  <main class="principal">
    <div class="barra">
      <h1 id="titulo">Inicio</h1>
      <span class="ficticio">Datos ficticios</span>
    </div>
    <div class="contenido" id="vista"></div>
  </main>
</div>

<section class="asistente" id="asistente" aria-label="Pregúntale a tu negocio">
  <header>
    <h2>Pregúntale a tu negocio</h2>
    <button class="icono-boton" id="asistente-nuevo" title="Nueva conversación" aria-label="Nueva conversación" data-icono="reiniciar"></button>
    <button class="icono-boton" id="asistente-ampliar" title="Ampliar" aria-label="Ampliar" data-icono="ampliar"></button>
    <button class="icono-boton" id="asistente-cerrar" title="Cerrar" aria-label="Cerrar" data-icono="cerrar"></button>
  </header>
  <div class="chat" id="chat"></div>
  <div class="sugerencias" id="sugerencias"></div>
  <form class="entrada" id="formulario">
    <textarea id="pregunta" rows="1" placeholder="Pregunte en sus palabras…" aria-label="Pregunta"></textarea>
    <button class="boton" type="submit" id="enviar">Preguntar</button>
  </form>
</section>

<div class="aviso-flotante" id="avisos" aria-live="polite"></div>
<script type="module" src="js/panel.js"></script>
</body>
</html>
