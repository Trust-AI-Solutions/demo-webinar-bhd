<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>En vivo · Ferretería Los Pinos</title>
<meta name="description" content="Asistente de WhatsApp y panel del negocio lado a lado. Demostración con datos ficticios.">
<link rel="preload" href="fuentes/archivo-variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<div class="en-vivo">
  <header>
    <a class="marca" href="index.html"><span class="logo" data-icono="pino"></span><span><b>Ferretería Los Pinos</b><small>WhatsApp y panel, en vivo</small></span></a>
    <div class="espacio"></div>
    <span class="ficticio">Datos ficticios</span>
    <button class="boton secundario pequeno" id="restablecer" type="button">Restablecer la demo</button>
    <a class="boton secundario pequeno" href="index.html">Volver</a>
  </header>
  <div class="marcos">
    <figure data-chip="whatsapp"><figcaption><span>El cliente escribe por WhatsApp</span></figcaption><iframe src="whatsapp.html?incrustado" title="Asistente de WhatsApp"></iframe></figure>
    <figure data-chip="pino"><figcaption><span>El dueño lo ve en su panel</span></figcaption><iframe src="panel.html?incrustado#pedidos" title="Panel del negocio"></iframe></figure>
  </div>
</div>
<script type="module">
  import { ICONOS } from "./js/iconos.js";
  import { restablecerDemo } from "./js/estado.js";
  document.querySelectorAll("[data-icono]").forEach((el) => { el.innerHTML = ICONOS[el.dataset.icono] ?? ""; });
  document.getElementById("restablecer").addEventListener("click", () => {
    if (confirm("¿Borrar los pedidos, cotizaciones y avisos creados durante la demo?")) restablecerDemo();
  });
</script>
</body>
</html>
