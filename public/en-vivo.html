<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>En vivo · Ferretería Los Pinos</title>
<meta name="description" content="Asistente de WhatsApp y panel del negocio lado a lado. Demostración con datos ficticios.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<div class="en-vivo">
  <header>
    <div class="marca-logo"><div class="icono" data-icono="pino"></div><div><b>Ferretería Los Pinos</b><small>WhatsApp y panel, en vivo</small></div></div>
    <div class="espacio"></div>
    <span class="etiqueta-ficticia">Datos ficticios</span>
    <button class="boton secundario pequeno" id="restablecer" type="button">Restablecer la demo</button>
    <a class="boton secundario pequeno" href="index.html">Volver</a>
  </header>
  <div class="marcos">
    <iframe src="whatsapp.html?incrustado" title="Asistente de WhatsApp"></iframe>
    <iframe src="panel.html?incrustado#pedidos" title="Panel del negocio"></iframe>
  </div>
</div>
<script type="module">
  import { ICONOS } from "./js/iconos.js";
  import { restablecerDemo } from "./js/estado.js";
  document.querySelectorAll("[data-icono]").forEach((el) => { el.innerHTML = ICONOS[el.dataset.icono] ?? ""; });
  document.getElementById("restablecer").addEventListener("click", () => {
    if (confirm("¿Borrar los pedidos, cotizaciones y avisos creados durante la demo?")) restablecerDemo();
  });
</script>
</body>
</html>
