<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo · Panadería El Trigal</title>
<meta name="description" content="Demostración de un panel de negocio y un asistente de WhatsApp con IA, con una empresa y datos ficticios.">
<link rel="preload" href="fuentes/inter-variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/estilos.css">
<link rel="stylesheet" href="intro/intro.css">
</head>
<body>
<!--
THESIS: el panel de una panadería dominicana como un bizcocho de cumpleaños: cada cifra es un bloque de glaseado que chorrea sobre su nombre. Rechaza el panel de tarjetas grises iguales.
OWN-WORLD: fondo suspiro (#fff6f8), tinta de chocolate, glaseados fresa, cielo, mora, caramelo, vainilla y pistacho con borde que gotea; pastillas redondas; chispitas de colores en la portada y en el asistente; logo de cupcake. Estados: rojo urgente, ámbar atender, verde bien.
STORY: el dueño reconoce su panadería, ve qué atender hoy y le pregunta al panel; el pedido de WhatsApp llega con chispitas.
FIRST VIEWPORT: portada con titular grande y tres cajas de bizcocho (WhatsApp, Panel, Los dos); en el panel, seis bloques de glaseado arriba, gráficos y alertas debajo, "Pregúntale a tu negocio" abajo a la izquierda.
FORM: "Suspiro y chispitas", fijada por el usuario (la ronda corrió degradada, sin retadores); semilla 3c991bd2.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
-->
<section class="intro" id="intro" aria-label="Introducción">
  <header>
    <span class="marca"><span class="logo" data-icono="logo"></span>Panadería El Trigal</span>
    <span class="ficticio">Datos ficticios</span>
  </header>
  <div class="intro__escena" id="intro-escena"></div>
  <div class="intro__acciones">
    <button class="boton intro__comenzar" id="comenzar" type="button">Comenzar</button>
    <button class="boton secundario intro__comenzar" id="ver-de-nuevo" type="button">Ver de nuevo</button>
  </div>
</section>

<div class="portada" id="portada" hidden>
  <header>
    <span class="marca"><span class="logo" data-icono="logo"></span>Panadería El Trigal</span>
    <span class="ficticio">Datos ficticios</span>
  </header>
  <main>
    <h1>Así trabaja la IA en una panadería como la suya</h1>
    <nav class="opciones" aria-label="Vistas de la demo">
      <a class="whatsapp" href="whatsapp.html"><span data-icono="whatsapp"></span><b>WhatsApp <span data-icono="flecha"></span></b></a>
      <a href="panel.html"><span data-icono="ventas"></span><b>Panel <span data-icono="flecha"></span></b></a>
      <a href="en-vivo.html"><span data-icono="pantalla"></span><b>Los dos a la vez <span data-icono="flecha"></span></b></a>
    </nav>
  </main>
  <footer>
    <button class="boton secundario pequeno" id="restablecer" type="button">Restablecer la demo</button>
    <button class="boton secundario pequeno" id="ver-intro" type="button">Ver la introducción</button>
  </footer>
</div>
<script type="module">
  import { ICONOS } from "./js/iconos.js";
  import { restablecerDemo } from "./js/estado.js";
  document.querySelectorAll("[data-icono]").forEach((el) => { el.innerHTML = ICONOS[el.dataset.icono] ?? ""; });
  // Primero la introducción animada; "Comenzar" muestra la portada. Si ya se vio en esta
  // pestaña (por ejemplo, al volver desde el panel), se va directo a la portada.
  const intro = document.getElementById("intro");
  const portada = document.getElementById("portada");
  const vista = () => { try { return sessionStorage.getItem("demo-intro-vista") === "1"; } catch { return false; } };
  const marcarVista = (v) => { try { v ? sessionStorage.setItem("demo-intro-vista", "1") : sessionStorage.removeItem("demo-intro-vista"); } catch { /* ignorar */ } };
  const mostrarPortada = () => {
    marcarVista(true);
    intro.hidden = true;
    portada.hidden = false;
  };
  const mostrarIntro = () => {
    marcarVista(false);
    portada.hidden = true;
    intro.hidden = false;
    window.repetirIntro?.();
    document.getElementById("comenzar").focus({ preventScroll: true });
  };
  document.getElementById("comenzar").addEventListener("click", mostrarPortada);
  document.getElementById("ver-de-nuevo").addEventListener("click", () => window.repetirIntro?.());
  document.getElementById("ver-intro").addEventListener("click", mostrarIntro);
  if (vista()) mostrarPortada();
  const restablecer = document.getElementById("restablecer");
  restablecer.addEventListener("click", () => {
    restablecerDemo();
    restablecer.textContent = "Listo";
    setTimeout(() => { restablecer.textContent = "Restablecer la demo"; }, 2000);
  });
</script>
<script type="module" src="intro/intro.js"></script>
</body>
</html>
